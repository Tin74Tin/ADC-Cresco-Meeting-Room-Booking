<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ADC Cresco">
<meta name="theme-color" content="#DB3131">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>ADC Cresco Meeting Room</title>
<style>
 :root{--adc:#DB3131;--adc-dark:#B82626}
 body{font-family:-apple-system,system-ui,sans-serif;max-width:640px;margin:0 auto;padding:16px;background:#f6f7f9;color:#1d2330}
 header{text-align:center;padding:8px 0 4px}
 header img{width:200px;max-width:60%;height:auto}
 h1{font-size:1.3rem;margin:8px 0 2px;color:var(--adc)}
 .sub{color:#667;font-size:.9rem}
 .card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.08);border-top:4px solid var(--adc)}
 label{display:block;font-weight:600;margin:10px 0 4px}
 input,select,button{width:100%;padding:12px;font-size:16px;border:1px solid #ccd;border-radius:8px;box-sizing:border-box;background:#fff}
 input:focus,select:focus{outline:2px solid var(--adc);border-color:var(--adc)}
 button{background:var(--adc);color:#fff;border:none;font-weight:600;margin-top:14px;cursor:pointer}
 button:active{background:var(--adc-dark)}
 button:disabled{background:#c9cbd3;cursor:not-allowed}
 .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
 .slot{padding:10px 4px;text-align:center;border-radius:8px;border:1px solid #ccd;background:#fff;cursor:pointer;font-size:14px}
 .slot.sel{background:var(--adc);color:#fff;border-color:var(--adc)}
 .slot.taken{background:#eceef2;color:#889;cursor:not-allowed;font-size:12px}
 #msg{margin-top:10px;font-weight:600}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="ADC – Advisors Development Club">
  <h1>Cresco Meeting Room</h1>
  <div class="sub">Book in 30-minute blocks</div>
</header>

<div class="card">
  <label for="name">Your name</label>
  <input id="name" placeholder="Enter your name">

  <label for="group">ADC group</label>
  <select id="group">
    <option value="">— Select group —</option>
    <option>ADC Infinity</option>
    <option>ADC JosephWong</option>
    <option>ADC StacyCheng</option>
    <option>ADC Tin</option>
    <option>ADC Wellplan Financial</option>
  </select>

  <label for="date">Date</label>
  <input type="date" id="date">
</div>

<div class="card">
  <label>Time slots (tap consecutive slots)</label>
  <div class="grid" id="slots"></div>
  <button id="bookBtn" disabled>Book</button>
  <div id="msg"></div>
</div>

<script>
const SUPABASE_URL = 'https://hkbtjnbhyoyxnhotyzru.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrYnRqbmJoeW95eG5ob3R5enJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExODg5NzYsImV4cCI6MjEwNjc2NDk3Nn0.2jYS9pX0IQ1VrMqpdRJS5x0ic0IDX1Aq2VB_I0s3Cc8';
const OPEN = 9, CLOSE = 18;   // room hours: 9:00am – 6:00pm

const H = {apikey:SUPABASE_KEY, 'Content-Type':'application/json'};   // works with publishable or legacy anon key
const opts = {mode:'cors', credentials:'omit'};   // needed for iPhone/iPad home-screen mode
const $ = id => document.getElementById(id);
let taken = {}, selected = [];

const pad = n => String(n).padStart(2,'0');
function allSlots(){ const s=[]; for(let h=OPEN;h<CLOSE;h++){ s.push(pad(h)+':00', pad(h)+':30'); } return s; }
function endOf(s){ let [h,m]=s.split(':').map(Number); m+=30; if(m===60){h++;m=0;} return pad(h)+':'+pad(m); }

async function load(){
  selected = [];
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/adc_bookings?booking_date=eq.${$('date').value}&select=slot,booker_name,adc_group`, {headers:H, ...opts});
    taken = {}; (await r.json()).forEach(x => taken[x.slot] = x);
  }catch(e){ $('msg').textContent = 'Could not load bookings — check Supabase URL/key.'; }
  render();
}

function render(){
  $('slots').innerHTML = '';
  allSlots().forEach(s => {
    const b = document.createElement('div'); b.className = 'slot';
    if (taken[s]) { b.classList.add('taken'); b.textContent = `${s} ${taken[s].adc_group}`; b.title = taken[s].booker_name; }
    else { b.textContent = `${s}–${endOf(s)}`; if (selected.includes(s)) b.classList.add('sel'); b.onclick = () => toggle(s); }
    $('slots').appendChild(b);
  });
  validate();
}

function toggle(s){   // keeps the selection as one continuous block
  const all = allSlots(), i = all.indexOf(s);
  const idx = selected.map(x => all.indexOf(x)).sort((a,b)=>a-b);
  if (selected.includes(s)) selected = (i===idx[0] || i===idx.at(-1)) ? selected.filter(x=>x!==s) : [s];
  else if (idx.length && (i===idx[0]-1 || i===idx.at(-1)+1)) selected.push(s);
  else selected = [s];
  selected.sort(); render();
}

function validate(){ $('bookBtn').disabled = !($('name').value.trim() && $('group').value && selected.length); }

async function book(){
  const rows = selected.map(s => ({booking_date:$('date').value, slot:s, booker_name:$('name').value.trim(), adc_group:$('group').value}));
  const r = await fetch(`${SUPABASE_URL}/rest/v1/adc_bookings`, {method:'POST', headers:{...H, Prefer:'return=minimal'}, body:JSON.stringify(rows), ...opts});
  if (r.ok) $('msg').textContent = `✔ Booked ${selected[0]}–${endOf(selected.at(-1))} for ${rows[0].adc_group}`;
  else if (r.status === 409) $('msg').textContent = 'Someone just took one of those slots — please pick again.';
  else $('msg').textContent = 'Error: ' + await r.text();
  load();
}

const today = new Date().toLocaleDateString('en-CA');   // YYYY-MM-DD, local time
$('date').value = today; $('date').min = today;
$('date').onchange = () => { $('msg').textContent=''; load(); };
$('name').oninput = validate; $('group').onchange = validate; $('bookBtn').onclick = book;
load();
</script>
</body>
</html>
